name: One-time model bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: pip install --no-cache-dir huggingface_hub

      - name: Download Qwen2.5 1.5B Instruct Q4_K_M
        env:
          MODEL_DIR: ${{ runner.temp }}/model
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          path = hf_hub_download(
              repo_id="Qwen/Qwen2.5-1.5B-Instruct-GGUF",
              filename="qwen2.5-1.5b-instruct-q4_k_m.gguf",
              local_dir=os.environ["MODEL_DIR"],
          )
          print(path)
          PY

      - name: Verify model checksum
        env:
          MODEL_DIR: ${{ runner.temp }}/model
        run: |
          set -euo pipefail
          cd "$MODEL_DIR"
          echo "6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  qwen2.5-1.5b-instruct-q4_k_m.gguf" | sha256sum -c -

      - name: Publish model as repository release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_DIR: ${{ runner.temp }}/model
          TAG: model-qwen2.5-1.5b-q4-k-m
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MODEL_DIR/qwen2.5-1.5b-instruct-q4_k_m.gguf" --repo "$REPO" --clobber
          else
            gh release create "$TAG"               "$MODEL_DIR/qwen2.5-1.5b-instruct-q4_k_m.gguf"               --repo "$REPO"               --target "${{ github.sha }}"               --title "Qwen2.5 1.5B Instruct Q4_K_M"               --notes "Inference model asset: Qwen/Qwen2.5-1.5B-Instruct-GGUF, q4_k_m. See model license and card on Hugging Face."
          fi

      - name: Print model download URL
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "Model release: https://github.com/$REPO/releases/tag/model-qwen2.5-1.5b-q4-k-m"
